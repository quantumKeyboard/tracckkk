[package]
name = "track"
version = "1.0.0"
description = "~track: a minimal, local-first dashboard"
authors = ["~track contributors"]
license = "MIT"
repository = "https://github.com/quantumKeyboard/tracckkk"
edition = "2024"
rust-version = "1.90"

[lib]
# the _lib suffix avoids a name clash with the binary on windows
# (https://github.com/rust-lang/cargo/issues/8519)
name = "track_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
