<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>~track</title>
<meta name="description" content="a minimal, local-first dashboard: habits, board, notes, calendar and plugins on a movable canvas." />
<meta name="theme-color" content="#eaf0fb" />
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<link rel="apple-touch-icon" href="assets/icons/192x192.png">
<!-- fonts are vendored locally, like chart.js, so nothing loads from a CDN -->
<link rel="stylesheet" href="vendor/fonts/dm-sans.css">
<link rel="stylesheet" href="core/styles.css">
</head>
<body>

  <div id="app-frame">
    <div id="rings"></div>
    <div id="content">
      <div id="menubar">
        <div class="wordmark">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span>~track</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;">
          <span id="save-dot" class="save-dot" title="" aria-hidden="true"></span>
          <button id="gear-btn" class="gear-btn" aria-label="settings">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          </button>
        </div>
      </div>
      <div id="canvas-wrap"><div id="canvas-inner"></div></div>
    </div>
    <div id="overlay"></div>
    <div id="sidebar">
      <div id="sidebar-head">
        <span>settings</span>
        <button id="sidebar-close" class="icon-btn" aria-label="close">
          <svg viewBox="0 0 20 20" width="14" height="14" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg>
        </button>
      </div>
      <div id="sidebar-body"></div>
    </div>
  </div>

  <!-- vendored locally so the app never depends on a CDN being reachable -->
  <script src="vendor/chart.umd.js"></script>

  <!-- core -->
  <script src="core/theme.js"></script>
  <script src="core/icons.js"></script>
  <script src="core/store.js"></script>
  <script src="core/platform.js"></script>

  <!-- default plugins (always loaded; community plugins are listed in plugins/manifest.js) -->
  <script src="plugins/note.plugin.js"></script>
  <script src="plugins/checklist.plugin.js"></script>
  <script src="plugins/counter.plugin.js"></script>
  <script src="plugins/manifest.js"></script>

  <!-- the kernel, loaded last -->
  <script src="core/engine.js"></script>
</body>
</html>
