name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # no npm install: the checks and the web build use only node built-ins
      - run: node scripts/check.mjs
      - run: node scripts/build-web.mjs
