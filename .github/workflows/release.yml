# builds the windows installers and the android apk when you push a v* tag,
# and attaches them to a draft github release for you to review and publish.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '~track ${{ github.ref_name }}'
          releaseBody: |
            see [CHANGELOG.md](https://github.com/quantumKeyboard/tracckkk/blob/main/CHANGELOG.md) for what changed.

            **windows**: download `track_*_x64-setup.exe` (or the `.msi`). smartscreen may warn because the installer isn't code-signed: *more info -> run anyway*.

            **android**: download `track_*_android.apk`, open it, and allow installing from that app when asked.
            if a newer version won't install over an older one, export a backup (settings -> export -> everything), uninstall, install the new apk, and import the backup.

            **web**: https://quantumkeyboard.github.io/tracckkk/ (install it as an app from the browser menu)
          releaseDraft: true
          prerelease: false

  android:
    # waits for the windows job so there's exactly one draft release to upload into
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      # with the ANDROID_KEY_* secrets set, the apk is signed with your permanent key.
      # without them, a throwaway key is made for this one build: the apk installs,
      # but a later build signed with a different key can't update it in place
      # (people would export a backup, uninstall, reinstall). see docs/BUILDING.md
      - name: set up signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEY_BASE64" ]; then
            echo "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            echo "::warning::no ANDROID_KEY_* secrets -- signing with a throwaway key. future builds won't install over this one. see docs/BUILDING.md"
            ANDROID_KEY_ALIAS=track
            ANDROID_KEY_PASSWORD=$(openssl rand -hex 24)
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 -keyalg RSA -keysize 2048 \
              -validity 10000 -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEY_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" \
              -dname "CN=~track temporary build key"
          fi
          echo "::add-mask::$ANDROID_KEY_PASSWORD"
          cat > src-tauri/gen/android/keystore.properties <<PROPS
          keyAlias=$ANDROID_KEY_ALIAS
          password=$ANDROID_KEY_PASSWORD
          storeFile=$RUNNER_TEMP/release.jks
          PROPS

      # the runner image ships an sdk; install a pinned ndk into it rather than
      # relying on whichever version the image happens to have
      - name: install android ndk
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: build apk
        run: npx tauri android build --apk

      - name: rename apk
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          cp "$apk" "track_${GITHUB_REF_NAME#v}_android.apk"

      - name: attach apk to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" track_*_android.apk --clobber

      - name: keep the apk as a build artifact too
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: track_*_android.apk
